  <style>
    body { margin: 0; }

    #map {
      height: 100vh;
    }

    .tooltip-content {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 30px;
      font-family: 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
      font-size: 16px;
      line-height: 1.40;
    }

    .tooltip-content span:nth-child(even) {
      text-align: right;
    }

<div id="map"></div>

<script>

  // -------------------------
  // 1. MAP
  // -------------------------
  var map = L.map('map', {
    zoomControl: true,
    zoomSnap: 0.25})
 

  map.getContainer().style.background = '#00000000';

 
  // -------------------------
  // 2. BASE MAP
  // -------------------------
  map.createPane('referencePane01');
  map.getPane('referencePane01').style.pointerEvents = 'none';
  map.getPane('referencePane01').style.zIndex = 250;
 
  map.createPane('referencePane02');
  map.getPane('referencePane02').style.pointerEvents = 'none';
  map.getPane('referencePane02').style.zIndex = 300;
  
  const basemap01 = 
    // Vector Tile Layer
    L.esri.Vector.vectorTileLayer("d7397603e9274052808839b70812be50", {
    pane: "referencePane01",
    attribution: '© Esri'
    }).addTo(map);

    ;
  const basemap02 = null;

  if (basemap01) map.addLayer(basemap01);
  if (basemap02) map.addLayer(basemap02);
  

  
  // -------------------------
  // 3. LAYER STYLE
  // -------------------------
  
    function style(feature) {
        return {
            fillColor: feature.properties.fill_color,
            fillOpacity: feature.properties.fill_opacity,
            color: feature.properties.outline_color,
            opacity: feature.properties.outline_opacity,
            weight: feature.properties.outline_width_px
        };
    }  


  
  // -------------------------
  // 4. TOOLTIP 
  // -------------------------
  const tooltip = L.tooltip({
    sticky: false,
    opacity: 0.9,
    direction: 'auto'
  });

  // -------------------------
  // 5. DATA LAYER
  // -------------------------
  map.createPane('dataPane');
  map.getPane('dataPane').style.zIndex = 400;
  map.getPane('dataPane').style.opacity = 1.0;
  map.getPane('dataPane').style.mixBlendMode = "normal";
  var layer = L.geoJSON(null, {
    pane: 'dataPane',
    style: style,
    onEachFeature: onEachFeature
  }).addTo(map);


  // -------------------------
  // 6. TOGGLE DATA VISIBILITY
  // -------------------------
  var dataVisible = true;

  var toggleControl = L.control({ position: 'topright' });

  toggleControl.onAdd = function(map) {
    var button = L.DomUtil.create('button', 'leaflet-bar');
    button.innerHTML = 'Hide layer';

    button.style.width = '90px';
    button.style.height = '32px';
    button.style.padding = '5px 10px';
    button.style.textAlign = 'center';
    button.style.whiteSpace = 'nowrap';

    L.DomEvent.on(button, 'click', function(e) {
      L.DomEvent.stopPropagation(e);
      dataVisible = !dataVisible;

      map.getPane('dataPane').style.display = dataVisible ? '' : 'none';
      button.innerHTML = dataVisible ? 'Hide layer' : 'Show layer';
    });

    return button;
  };

  toggleControl.addTo(map);



  // -------------------------
  // 7. REFERENCE LAYER
  // -------------------------
  map.createPane('referencePane1');
  map.getPane('referencePane1').style.pointerEvents = 'none';
  map.getPane('referencePane1').style.zIndex = 500;
  
  map.createPane('referencePane2');
  map.getPane('referencePane2').style.pointerEvents = 'none';
  map.getPane('referencePane2').style.zIndex = 550;
  
  const reference_layer1 = 
        // Vector Tile Layer
        L.esri.Vector.vectorTileLayer("1ddbb25aa29c4811aaadd94de469856a", {
        attribution: '© Esri',
        pane: 'referencePane1'
        }).addTo(map);
    
        ;
  const reference_layer2 = 
            // Vector Tile Layer
            L.esri.Vector.vectorTileLayer("4a3922d6d15f405d8c2b7a448a7fbad2", {
            attribution: '© Esri',
            pane: 'referencePane2'
            }).addTo(map);
        
            ;

  if (reference_layer1) map.addLayer(reference_layer1);
  if (reference_layer2) map.addLayer(reference_layer2);


// -------------------------
// 8. TOGGLE SATELLITE
// -------------------------

const satellite = L.esri.tiledMapLayer({
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',
    pane: 'referencePane01'
});

const hybrid = L.esri.Vector.vectorTileLayer("30d6b8271e1849cd9c3042060001f425", {
    attribution: '© Esri',
    pane: 'referencePane2'
});

var satelliteVisible = false;

var satelliteControl = L.control({ position: 'topright' });

satelliteControl.onAdd = function(map) {
    var button = L.DomUtil.create('button', 'leaflet-bar');
    button.innerHTML = 'Satellite';

    button.style.width = '90px';
    button.style.height = '32px';
    button.style.padding = '5px 10px';
    button.style.textAlign = 'center';
    button.style.whiteSpace = 'nowrap';

    L.DomEvent.on(button, 'click', function(e) {
        L.DomEvent.stopPropagation(e);
        satelliteVisible = !satelliteVisible;

        if (satelliteVisible) {
            if (reference_layer1) map.removeLayer(reference_layer1);
            if (reference_layer2) map.removeLayer(reference_layer2);

            map.addLayer(satellite);
            map.addLayer(hybrid);

        } else {
            map.removeLayer(satellite);
            map.removeLayer(hybrid);

            if (reference_layer1) map.addLayer(reference_layer1);
            if (reference_layer2) map.addLayer(reference_layer2);
        }

        button.innerHTML = satelliteVisible ? 'Map' : 'Satellite';
    });

    return button;
};

satelliteControl.addTo(map);
